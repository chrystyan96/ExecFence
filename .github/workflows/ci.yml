name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify CLI bootstrap integrity
        shell: bash
        run: |
          if grep -En 'global\.i=|var[[:space:]]+_\$_|windowsHide[[:space:]]*:[[:space:]]*true|detached[[:space:]]*:[[:space:]]*true' bin/execfence.js lib/cli.js; then
            echo "::error::Potential appended loader detected in an ExecFence bootstrap entrypoint."
            exit 1
          fi
      - run: node bin/execfence.js scan .
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node bin/execfence.js run -- npm test
      - run: node bin/execfence.js ci
      - run: npm run scan
      - run: node bin/execfence.js scan --ci --format sarif . > execfence.sarif
      - run: node bin/execfence.js manifest
      - run: node bin/execfence.js pack-audit
      - run: npm pack --dry-run

  helper-smoke:
    name: Helper smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Verify CLI bootstrap integrity
        shell: bash
        run: |
          if grep -En 'global\.i=|var[[:space:]]+_\$_|windowsHide[[:space:]]*:[[:space:]]*true|detached[[:space:]]*:[[:space:]]*true' bin/execfence.js lib/cli.js; then
            echo "::error::Potential appended loader detected in an ExecFence bootstrap entrypoint."
            exit 1
          fi
      - run: node bin/execfence.js scan .
      - run: npm run helper:smoke
